
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>English Fun - Learn Alphabet</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #FFF6E8;
    color: #333;
}

header {
    background: #6C63FF;
    color: white;
    text-align: center;
    padding: 20px;
}

header h1 {
    margin: 0;
    font-size: 32px;
}

header p {
    margin-bottom: 0;
    font-size: 18px;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 25px 20px;
}

h2 {
    text-align: center;
    color: #FF8C42;
}

.alphabet-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
    gap: 15px;
    margin-top: 25px;
}

.letter-card {
    background: white;
    border: 3px solid #FFD166;
    border-radius: 18px;
    padding: 15px 5px;
    cursor: pointer;
    text-align: center;
    transition: 0.2s;
}

.letter-card:hover {
    background: #FFD166;
    transform: scale(1.05);
}

.letter-card .capital {
    font-size: 35px;
    font-weight: bold;
    color: #6C63FF;
}

.letter-card .small {
    font-size: 23px;
    color: #FF8C42;
}

.letter-card .emoji {
    font-size: 35px;
    margin: 8px 0;
}

.letter-card .word {
    font-size: 16px;
    font-weight: bold;
}

.learning-box {
    background: white;
    border-radius: 25px;
    padding: 25px;
    margin-top: 30px;
    text-align: center;
    box-shadow: 0 4px 10px #ddd;
}

.big-letter {
    font-size: 90px;
    font-weight: bold;
    color: #6C63FF;
}

.big-picture {
    font-size: 100px;
    margin: 10px;
}

.big-word {
    font-size: 32px;
    font-weight: bold;
    color: #FF8C42;
}

button {
    border: none;
    border-radius: 15px;
    padding: 15px 25px;
    font-size: 18px;
    cursor: pointer;
    margin: 8px;
}

.listen-btn {
    background: #6C63FF;
    color: white;
}

.next-btn {
    background: #FF8C42;
    color: white;
}

.footer {
    text-align: center;
    margin: 25px 0;
}

</style>
</head>

<body>

<header>
    <h1>🌈 English Fun</h1>
    <p>Let's Learn the Alphabet!</p>
</header>

<div class="container">

    <h2>Choose a Letter</h2>

    <div class="alphabet-grid" id="alphabetGrid"></div>

    <div class="learning-box">

        <h2>Learn Your Letter</h2>

        <div class="big-letter" id="bigLetter">A a</div>

        <div class="big-picture" id="bigPicture">🍎</div>

        <div class="big-word" id="bigWord">Apple</div>

        <button class="listen-btn" onclick="listen()">
            🔊 Listen
        </button>

    </div>

    <div class="footer">

        <button class="next-btn" onclick="goPractice()">
            Let's Practise! ➜
        </button>

    </div>

</div>

<script>

const alphabet = [
    ["A", "Apple", "🍎"],
    ["B", "Ball", "⚽"],
    ["C", "Cat", "🐱"],
    ["D", "Dog", "🐶"],
    ["E", "Elephant", "🐘"],
    ["F", "Fish", "🐟"],
    ["G", "Goat", "🐐"],
    ["H", "House", "🏠"],
    ["I", "Ice cream", "🍦"],
    ["J", "Juice", "🧃"],
    ["K", "Kite", "🪁"],
    ["L", "Lion", "🦁"],
    ["M", "Monkey", "🐵"],
    ["N", "Nest", "🪺"],
    ["O", "Orange", "🍊"],
    ["P", "Penguin", "🐧"],
    ["Q", "Queen", "👑"],
    ["R", "Rabbit", "🐰"],
    ["S", "Sun", "☀️"],
    ["T", "Tiger", "🐯"],
    ["U", "Umbrella", "☂️"],
    ["V", "Van", "🚐"],
    ["W", "Watermelon", "🍉"],
    ["X", "Xylophone", "🎵"],
    ["Y", "Yo-yo", "🪀"],
    ["Z", "Zebra", "🦓"]
];

let selectedIndex = 0;

// Create alphabet cards
function createAlphabetCards() {

    const grid = document.getElementById("alphabetGrid");

    alphabet.forEach(function(item, index) {

        const card = document.createElement("div");

        card.className = "letter-card";

        card.innerHTML = `
            <div class="capital">${item[0]}</div>
            <div class="small">${item[0].toLowerCase()}</div>
            <div class="emoji">${item[2]}</div>
            <div class="word">${item[1]}</div>
        `;

        card.onclick = function() {
            selectLetter(index);
        };

        grid.appendChild(card);
    });
}

// Display selected letter
function selectLetter(index) {

    selectedIndex = index;

    const item = alphabet[index];

    document.getElementById("bigLetter").textContent =
        item[0] + " " + item[0].toLowerCase();

    document.getElementById("bigPicture").textContent =
        item[2];

    document.getElementById("bigWord").textContent =
        item[1];
}

// Text-to-speech
function listen() {

    const item = alphabet[selectedIndex];

    if (!("speechSynthesis" in window)) {
        alert("Your browser does not support speech.");
        return;
    }

    window.speechSynthesis.cancel();

    const speech = new SpeechSynthesisUtterance(
        item[0] + ". " + item[1]
    );

    speech.lang = "en-US";
    speech.rate = 0.8;

    window.speechSynthesis.speak(speech);
}

// Go to next activity
function goPractice() {

    window.location.href = "practice.html";
}

// Start courseware
createAlphabetCards();

selectLetter(0);

</script>

</body>
</html>
